name: Backend verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: student_planner_testing
          MYSQL_ROOT_PASSWORD: disposable-ci-password
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_URL: ''
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: student_planner_testing
      DB_USERNAME: root
      DB_PASSWORD: disposable-ci-password
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      AI_PROVIDER: gemini
      GEMINI_API_KEY: ''
      OPENAI_API_KEY: ''
      AI_LIVE_SMOKE: '0'
      AI_LIVE_ALLOW_PAID: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mbstring, xml, dom, fileinfo, gd, zip, intl, bcmath
          coverage: none
          tools: composer:v2
          ini-values: memory_limit=512M
      - name: Install locked dependencies
        run: |
          composer validate --strict --no-check-publish
          composer install --no-interaction --prefer-dist --no-progress
          composer check-platform-reqs
      - name: Initialize test-only application
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan config:cache
          php artisan config:clear
          php artisan route:list --path=api --except-vendor
      - name: Verify disposable MySQL migrations
        env:
          DISPOSABLE_CI_MYSQL_CONTAINER_ID: ${{ job.services.mysql.id }}
        run: php .github/scripts/verify-ci-migrations.php
      - name: Verify formatting
        run: |
          vendor/bin/pint --test
          git diff --check

  deploy:
    needs: verify
    if: >-
      ${{ needs.verify.result == 'success' && github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          github.repository == 'BashukOleksii/Student-AI-Planner-Backend' &&
          vars.LIGHTSAIL_BACKEND_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: production
      url: https://student-ai-planner.duckdns.org
    concurrency:
      group: lightsail-backend-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Deploy the verified Backend commit
        id: deployment
        env:
          DEPLOY_ENABLED: ${{ vars.LIGHTSAIL_BACKEND_DEPLOY_ENABLED }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          LIGHTSAIL_BACKEND_SSH_PRIVATE_KEY: ${{ secrets.LIGHTSAIL_BACKEND_SSH_PRIVATE_KEY }}
          LIGHTSAIL_BACKEND_KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_BACKEND_KNOWN_HOSTS }}
        run: bash .github/scripts/deploy-lightsail.sh
      - name: Report deployment outcome
        if: ${{ always() }}
        env:
          DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
          TESTED_SHA: ${{ github.sha }}
        run: |
          {
            echo "Tested SHA: $TESTED_SHA"
            echo "Deployment step: $DEPLOY_OUTCOME"
            if [ "$DEPLOY_OUTCOME" = success ]; then
              echo "Deployed SHA: $TESTED_SHA"
              echo 'Smoke checks: internal 200, public profile 401, CSRF 204; PHP-FPM, queue and scheduler timer active.'
            else
              echo 'Deployment/health not confirmed. Inspect the deployment log and server state.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"