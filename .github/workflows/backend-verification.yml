name: Backend verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: student_planner_testing
          MYSQL_ROOT_PASSWORD: disposable-ci-password
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_URL: ''
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: student_planner_testing
      DB_USERNAME: root
      DB_PASSWORD: disposable-ci-password
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      AI_PROVIDER: gemini
      GEMINI_API_KEY: ''
      GEMINI_MODEL: gemini-2.5-flash
      OPENAI_API_KEY: ''
      OPENAI_MODEL: gpt-5.4-mini
      AI_LIVE_SMOKE: '0'
      AI_LIVE_ALLOW_PAID: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mbstring, xml, dom, fileinfo, gd, zip, intl, bcmath
          coverage: none
          tools: composer:v2
          ini-values: memory_limit=512M
      - name: Install locked dependencies
        run: |
          composer validate --strict --no-check-publish
          composer install --no-interaction --prefer-dist --no-progress
          composer check-platform-reqs
      - name: Initialize test-only application
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan config:cache
          php artisan config:clear
          php artisan route:list --path=api --except-vendor
      - name: Verify disposable MySQL migrations and lock instrumentation
        env:
          DISPOSABLE_CI_MYSQL_CONTAINER_ID: ${{ job.services.mysql.id }}
        run: php .github/scripts/verify-ci-migrations.php
      - name: Verify formatting
        run: |
          vendor/bin/pint --test
          git diff --check
      - name: Run complete offline MySQL suite including independent processes
        run: vendor/bin/phpunit --log-junit phpunit-full.xml
      - name: Run Gemini action regression matrix with offline native fixtures
        env:
          AI_TEST_PROVIDER: gemini
        run: vendor/bin/phpunit tests/Feature/AiTaskActionsTest.php tests/Feature/AiSubtaskReminderActionsTest.php tests/Feature/AiPlanningActionsTest.php tests/Feature/AiLessonActionsTest.php --log-junit phpunit-gemini-actions.xml
      - name: Retain verification results
        if: ${{ always() && hashFiles('phpunit-full.xml') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-phpunit-results
          path: |
            phpunit-full.xml
            phpunit-gemini-actions.xml
          if-no-files-found: error
          retention-days: 7
